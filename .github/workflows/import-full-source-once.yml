name: Import full PDF source once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-full-source-once.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Replace submodule with complete source files
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --stage vendor/bentopdf | grep -q '^160000 ' || { echo 'No linked source to import'; exit 0; }
          expected="$(git ls-files --stage vendor/bentopdf | awk '{print $2}')"
          actual="$(git -C vendor/bentopdf rev-parse HEAD)"
          test "$expected" = "$actual"
          mkdir -p app
          cp -a vendor/bentopdf/. app/
          rm -f app/.git
          python3 - <<'PY'
          from pathlib import Path
          files = [p for p in Path('app').rglob('*') if p.is_file()]
          print('Source files copied:',len(files))
          if len(files) < 1500:
              raise SystemExit('Incomplete source import')
          for name in ('LICENSE','package-lock.json','package.json','simple-index.html','src/css/styles.css','public'):
              if not (Path('app') / name).exists():
                  raise SystemExit('Missing source: '+name)
          PY
          git rm --cached -f vendor/bentopdf
          git rm -f .gitmodules
          rm -rf vendor/bentopdf
          rmdir vendor || true
          git add -f app
      - name: Make build scripts fully local
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files = [
              '.github/workflows/private-bentopdf.yml',
              'CAI_DAT_VA_CHAY_WINDOWS.bat',
              'CHAY_PDF_OFFLINE.bat',
              'scripts/prepare-private-bento.mjs',
              'scripts/secure-private-build.mjs',
              'scripts/serve-private-bento.mjs'
          ]
          for filename in files:
              path=Path(filename)
              old=path.read_text(encoding='utf-8')
              new=old.replace('vendor/bentopdf','app')
              new=new.replace('vendor\\bentopdf','app')
              new=new.replace("path.join(root, 'vendor', 'bentopdf')","path.join(root, 'app')")
              new=new.replace("path.resolve(import.meta.dirname, '..', 'vendor', 'bentopdf'","path.resolve(import.meta.dirname, '..', 'app'")
              if filename.endswith('private-bentopdf.yml'):
                  new=new.replace('          submodules: recursive\n','')
                  new=new.replace('Checkout PDF repo with pinned BentoPDF source','Checkout owned PDF application source')
                  new=new.replace('name: Private BentoPDF - build and deploy','name: Personal PDF - build and deploy')
              if filename.endswith('CAI_DAT_VA_CHAY_WINDOWS.bat'):
                  new='\n'.join(line for line in new.split('\n') if not line.startswith('git submodule update '))
                  new=new.replace('Ma nguon BentoPDF duoc lay tu Git submodule.','Ma nguon PDF da nam hoan toan trong GitHub cua ban.')
              if filename.endswith('prepare-private-bento.mjs'):
                  new=new.replace('Upstream stays in vendor/bentopdf as a pinned AGPL-3.0 Git submodule.','Source is stored in app as owned Git files (AGPL-3.0).')
                  new=new.replace('Did you run git submodule update --init and npm ci?','Did you run npm ci in app?')
              if new == old:
                  raise SystemExit('Could not update source path in '+filename)
              path.write_text(new,encoding='utf-8')
          Path('README.md').write_text("""# PDF made by Nghia - self-hosted independent source
          
          All application source is directly committed under app/ (including src/, public/, package.json and original LICENSE).
          There are no Git submodules. GitHub Actions builds from app/ and uses customization/bento-light.css for the personal white interface.
          
          ## Windows
          Install Node.js 22 and Git; clone this repository normally (no submodule options).
          Run CAI_DAT_VA_CHAY_WINDOWS.bat the first time, and CHAY_PDF_OFFLINE.bat subsequently.
          Local application: http://127.0.0.1:8080/PDF/
          
          ## Privacy and dependencies
          Processing user files is browser-local. PDF/OCR/WASM engines are self-hosted with same-origin protections.
          Initial installation/build may need third-party packages, OCR data and font downloads; no PDF files are sent to the source author.
          The complete source can now be maintained without contacting or fetching the original application repository.
          
          ## Copyright and license
          This project is based on BentoPDF, AGPL-3.0-only. Original copyright and license notices remain
          inside app/. The copy is technically independent of the upstream Git repository; license duties
          and third-party open-source licenses continue to apply when distributing modified copies.
          """,encoding='utf-8')
          PY
          git rm .github/workflows/import-full-source-once.yml
          git add .github/workflows/private-bentopdf.yml CAI_DAT_VA_CHAY_WINDOWS.bat \
            CHAY_PDF_OFFLINE.bat README.md scripts/
          if git ls-files --stage | grep -q '^160000 '; then echo 'Remaining gitlink'; exit 1; fi
          test ! -e .gitmodules
          git diff --cached --stat | tail -n 10
      - name: Push complete source to owned repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Import complete PDF source; remove external git submodule dependency'
          git push origin HEAD:main
          echo 'Full source committed, no external submodule required.' >> "$GITHUB_STEP_SUMMARY"
